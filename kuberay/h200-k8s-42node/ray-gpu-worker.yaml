# Ray GPU worker DaemonSet — current production H200 42-node fleet (ray-system).
#
# IMPORTANT: this cluster has NO KubeRay operator (no ray.io CRDs). The Ray cluster is
# plain Kubernetes objects: this DaemonSet (42 GPU workers) + ray-head.yaml (head Deployment
# + Service). The sibling raycluster-h20-16node.yaml is an unused migration draft; THIS is
# what actually runs.
#
# Captured from the live object on 2026-06-09 (kubectl get ds ... -o yaml), with runtime-only
# fields stripped (status, uid, resourceVersion, generation, managed annotations). It is the
# post-patch state: it already incorporates all four h200-k8s runbook fixes, so a fresh
# `kubectl apply` of this file needs no follow-up patch:
#   1. ray temp-dir on the container overlay (/ray_spill_local/ray, NOT the small ~100 GB
#      hostPath /ray_local) so object spill can't fill the node NVMe and OOM-kill workers.
#   2. --object-store-memory=230000000000 (fits the 256 Gi /dev/shm, fewer spills).
#   3. deep_ep installed at startup from the prebuilt wheel on fsx (the stock image
#      radixark/miles:sft-only-v4deps-20260603 ships without it; required by PRESET_MOE_DEEPEP=1).
#   4. (NCCL 600s dist-ckpt timeout + 3.7 TB warmup save are run.sh-side: --distributed-timeout-minutes
#      / --no-save-optim, not here.)
# cluster/k8s/patch_ray_worker_storage.sh stays as a re-apply tool for #1/#2 if a future raw
# apply ever predates these edits; against this file it is a no-op.
#
# Pinned to the 42 HyperPod worker instance IDs below (no autoscaler — desired == this keep-list,
# == fleet/h200_k8s_42node.env V4_WORKER_IPS). EFA RDMA reaches the pods via hostNetwork +
# /dev/infiniband hostPath + IPC_LOCK; the EFA/aws-ofi-nccl plugin itself is staged on fsx and
# wired in by run.sh (V4_EFA_*), not here.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ray-gpu-worker-h200-k8s-42node
  namespace: ray-system
  labels:
    app.kubernetes.io/name: ray-gpu-worker-h200-k8s-42node
    app.kubernetes.io/part-of: ray-gpu-node-64
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: ray-gpu-worker-h200-k8s-42node
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 100%
  template:
    metadata:
      annotations:
        prometheus.io/port: "8081"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/name: ray-gpu-worker-h200-k8s-42node
        app.kubernetes.io/part-of: ray-gpu-node-64
    spec:
      # The 42-node keep-list. These instance IDs ARE the fleet; editing this list changes
      # which physical H200 nodes join Ray. Keep in sync with fleet/h200_k8s_42node.env.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - hyperpod-i-027fe1086de6903c5
                - hyperpod-i-0384bb5cc5321c48a
                - hyperpod-i-0c9abc41cdcf625c6
                - hyperpod-i-08d871c5ad8f8421d
                - hyperpod-i-0a62c595edad36c5a
                - hyperpod-i-0ec24a67f4169f3cc
                - hyperpod-i-0f3d968018a3aa7c0
                - hyperpod-i-08aa388cb2d07bd96
                - hyperpod-i-09ca59dee5e209c78
                - hyperpod-i-077fbf8cfd50f0c5b
                - hyperpod-i-000384efa8cae28e9
                - hyperpod-i-0ffc81f340605176e
                - hyperpod-i-0008af2e0b1d20312
                - hyperpod-i-007fe5fc147ed7960
                - hyperpod-i-00a0e36474352e301
                - hyperpod-i-0ca3779aa7d21599d
                - hyperpod-i-02fba164a90c7a2ee
                - hyperpod-i-0b6d8a9e873fe6275
                - hyperpod-i-07dd36be9b5210e98
                - hyperpod-i-0235546b86d0e5223
                - hyperpod-i-0307710a2318900cc
                - hyperpod-i-035fd6e1fa89d45ea
                - hyperpod-i-0aa8ba582a3169b54
                - hyperpod-i-0501283c77f65665e
                - hyperpod-i-05565e4179fa649ea
                - hyperpod-i-09d727db4fec74b55
                - hyperpod-i-0652e42ea0f9e28e5
                - hyperpod-i-0821c6ab8dedf3ba4
                - hyperpod-i-0e54ee50bb9650e91
                - hyperpod-i-0938e4952dbd6c7f3
                - hyperpod-i-09f893f9633fb4dde
                - hyperpod-i-0a086fc26ea7bdace
                - hyperpod-i-0e348bdebb253e3c6
                - hyperpod-i-0a456ebfd73d5e954
                - hyperpod-i-0a7f03f7c2bb87843
                - hyperpod-i-0482de03b7f3e8df6
                - hyperpod-i-0b08da405017489e3
                - hyperpod-i-0b8aaf79ff7dc28cd
                - hyperpod-i-0b9365dbd4942753e
                - hyperpod-i-0d20b22a7b3c2fe1e
                - hyperpod-i-0c3bfbdd581b1e28c
                - hyperpod-i-0c8d4d1145f08a50a
      containers:
      - name: ray-worker
        image: docker.io/radixark/miles:sft-only-v4deps-20260603
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -lc
        args:
        - |
          set -euo pipefail
          if [ -f ~/miniconda3/bin/activate ]; then
            source ~/miniconda3/bin/activate
            conda activate RLSkill || true
          fi
          ray stop --force 2>/dev/null || true
          mkdir -p /ray_spill_local/ray
          ulimit -n 1048576 || true
          ulimit -l unlimited || true
          python3 - <<'PY'
          import socket
          import time

          deadline = time.time() + 300
          while True:
              try:
                  with socket.create_connection(("10.3.234.60", 6379), timeout=5):
                      break
              except OSError:
                  if time.time() > deadline:
                      raise
                  time.sleep(5)
          PY
          python3 -m pip install /mnt/fsx-cdsn/kaynzhang/deepseek-v4-flash/deps/wheels/deep_ep-1.2.1+9af0e0d-cp312-cp312-linux_x86_64.whl --no-deps -q 2>/dev/null || true
          exec ray start \
            --address=10.3.234.60:6379 \
            --node-ip-address="${HOST_IP}" \
            --metrics-export-port=8081 \
            --temp-dir=/ray_spill_local/ray \
            --num-cpus=180 \
            --num-gpus=8 \
            --disable-usage-stats \
            --object-store-memory=230000000000 \
            --block
        env:
        - name: HOST_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: PYTHONPATH
          value: /root/Megatron-LM:/root/TileKernels
        - name: HF_HOME
          value: /mnt/fsx-cdsn/kaynzhang/deepseek-v4-flash/.cache/huggingface
        - name: HF_DATASETS_CACHE
          value: /mnt/fsx-cdsn/kaynzhang/deepseek-v4-flash/.cache/huggingface/datasets
        - name: TRANSFORMERS_CACHE
          value: /mnt/fsx-cdsn/kaynzhang/deepseek-v4-flash/.cache/huggingface/transformers
        - name: HUGGINGFACE_HUB_CACHE
          value: /mnt/fsx-cdsn/kaynzhang/deepseek-v4-flash/.cache/huggingface/hub
        - name: TZ
          value: Asia/Shanghai
        ports:
        - containerPort: 8081
          name: metrics
          protocol: TCP
        resources:
          requests:
            cpu: "32"
            memory: 128Gi
            nvidia.com/gpu: "8"
          limits:
            cpu: "180"
            memory: 1800Gi
            nvidia.com/gpu: "8"
        securityContext:
          privileged: true
          capabilities:
            add:
            - IPC_LOCK
            - SYS_ADMIN
        volumeMounts:
        - name: fsx-storage
          mountPath: /mnt/fsx-cdsn/kaynzhang
          subPath: kaynzhang
        - name: ray-local
          mountPath: /ray_local
        - name: shm
          mountPath: /dev/shm
        - name: infiniband
          mountPath: /dev/infiniband
        workingDir: /mnt/fsx-cdsn/kaynzhang/deepseek-v4-flash/train/miles
      dnsPolicy: ClusterFirstWithHostNet
      hostIPC: true
      hostNetwork: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
      - name: fsx-storage
        persistentVolumeClaim:
          claimName: fsx-claim2
      - name: ray-local
        hostPath:
          path: /mnt/k8s-disks/0/ray-gpu-worker-h200-k8s-42node
          type: DirectoryOrCreate
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 256Gi
      - name: infiniband
        hostPath:
          path: /dev/infiniband
          type: Directory
